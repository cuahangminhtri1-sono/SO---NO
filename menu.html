<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0d7a5f">
<meta name="robots" content="noindex,nofollow">
<title>Gọi món</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#eef3f1;color:#15302a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;padding-bottom:96px}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid #16a34a;outline-offset:2px}

/* ── ĐẦU TRANG ── */
#top{position:sticky;top:0;z-index:50;background:#0d7a5f;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;box-shadow:0 2px 12px rgba(8,40,30,.22)}
#quan{font-size:18px;font-weight:800;line-height:1.3;margin:0 0 4px;word-break:break-word}
#ban{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
#tim{width:100%;margin-top:11px;border:none;border-radius:11px;padding:11px 13px;font-size:15px;font-family:inherit;background:#fff;color:#15302a}

/* ── TRẠNG THÁI ── */
#bao{padding:56px 26px;text-align:center;color:#43635b}
#bao .ic{font-size:44px;line-height:1;margin-bottom:14px}
#bao h2{font-size:17px;font-weight:800;color:#15302a;margin:0 0 8px}
#bao p{margin:0 0 18px;font-size:14px;line-height:1.65}
.btn-lai{border:none;background:#0d7a5f;color:#fff;border-radius:12px;padding:13px 26px;font-size:15px;font-weight:800}
#offline{display:none;background:#fff3cd;color:#7a5c00;font-size:12.5px;padding:8px 14px;text-align:center;font-weight:700}

/* ── THỰC ĐƠN ── */
#ds{padding:12px 12px 4px}
.nhom{font-size:12.5px;font-weight:800;color:#3f7a68;letter-spacing:.3px;margin:16px 4px 8px}
.nhom:first-child{margin-top:4px}
.mon{display:flex;align-items:center;gap:11px;background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:8px}
.mon-a{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:#e4ece9}
.mon-t{flex:1;min-width:0}
.mon-t b{display:block;font-size:14.5px;font-weight:700;line-height:1.35;word-break:break-word}
.mon-t span{display:block;font-size:14px;font-weight:800;color:#0d7a5f;margin-top:3px}
.mon-t i{font-style:normal;font-size:11.5px;color:#8d9d97}
.them{flex:none;border:none;background:#0d7a5f;color:#fff;width:40px;height:40px;border-radius:50%;font-size:23px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
.them:active{transform:scale(.92)}
.dem{flex:none;display:flex;align-items:center;gap:9px}
.dem button{border:none;background:#e6f2ee;color:#0d7a5f;width:34px;height:34px;border-radius:50%;font-size:19px;font-weight:800;line-height:1}
.dem b{min-width:20px;text-align:center;font-size:16px;font-weight:800}
.trong{text-align:center;color:#8d9d97;padding:30px 16px;font-size:14px}

/* ── THANH GIỎ ── */
#thanh{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#eef3f1;box-shadow:0 -6px 20px rgba(8,40,30,.13);display:none}
#thanh.on{display:block}
#xem{width:100%;border:none;background:#0d7a5f;color:#fff;border-radius:14px;padding:15px 16px;font-size:15.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:10px}
#xem em{font-style:normal;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 10px;font-size:13.5px}

/* ── KHAY XÁC NHẬN ── */
#khay{position:fixed;inset:0;z-index:80;background:rgba(8,26,20,.55);display:none;align-items:flex-end;justify-content:center}
#khay.on{display:flex}
#khay .sheet{width:100%;max-width:520px;background:#f5f8f7;border-radius:20px 20px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.grip{width:42px;height:4px;border-radius:4px;background:#cfdad6;margin:2px auto 12px}
.sheet h3{font-size:16.5px;font-weight:800;margin:0 0 12px;padding:0 2px}
.dong{background:#fff;border-radius:13px;padding:11px 12px;margin-bottom:8px}
.dong-h{display:flex;align-items:center;gap:10px}
.dong-h b{flex:1;min-width:0;font-size:14px;font-weight:700;word-break:break-word}
.dong-h .gia{font-size:14px;font-weight:800;color:#0d7a5f;white-space:nowrap}
.ghi{width:100%;margin-top:9px;border:1px solid #dce5e2;border-radius:9px;padding:8px 10px;font-size:13.5px;font-family:inherit;background:#fbfdfc}
#tong{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:800;padding:12px 4px 4px}
#tong b{font-size:21px;color:#c0392b}
#note{width:100%;border:1px solid #dce5e2;border-radius:11px;padding:11px;font-size:14px;font-family:inherit;margin-bottom:9px;background:#fff}
#gui{width:100%;border:none;background:#16a34a;color:#fff;border-radius:13px;padding:15px;font-size:16px;font-weight:800}
#gui:disabled{background:#a9c3b8}
#dong-khay{width:100%;border:none;background:#e6ebe9;color:#3c554e;border-radius:13px;padding:13px;font-size:14.5px;font-weight:800;margin-top:8px}
.canh{background:#fff8e6;border:1px solid #f3d98d;border-radius:11px;padding:10px 12px;font-size:12.5px;color:#856300;line-height:1.6;margin-bottom:10px}

/* ── ĐÃ GỬI ── */
#xong{position:fixed;inset:0;z-index:90;background:#f5f8f7;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px 26px;text-align:center}
#xong.on{display:flex}
#xong .tick{width:76px;height:76px;border-radius:50%;background:#16a34a;color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
#xong h2{font-size:20px;font-weight:800;margin:0 0 10px}
#xong p{margin:0 0 26px;font-size:14.5px;color:#4a6a61;line-height:1.65;max-width:300px}
#xong button{border:none;background:#0d7a5f;color:#fff;border-radius:13px;padding:14px 30px;font-size:15.5px;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="top" style="display:none">
  <h1 id="quan">&nbsp;</h1>
  <span id="ban">&nbsp;</span>
  <input id="tim" type="search" placeholder="Tìm món…" autocomplete="off" enterkeyhint="search">
</div>
<div id="offline">Đang dùng thực đơn đã lưu — mạng yếu</div>

<div id="bao"><div class="ic">⏳</div><h2>Đang mở thực đơn…</h2><p>Chờ một chút nhé.</p></div>
<div id="ds"></div>

<div id="thanh">
  <button id="xem" type="button">
    <span>Xem giỏ &amp; gửi bếp</span>
    <em id="xem-sl">0 món</em>
    <span id="xem-tien">0đ</span>
  </button>
</div>

<div id="khay">
  <div class="sheet">
    <div class="grip"></div>
    <h3>Đơn của bạn</h3>
    <div class="canh">Gửi xong, nhân viên sẽ ra xác nhận rồi mới tính vào hoá đơn bàn.</div>
    <div id="gio"></div>
    <div id="tong"><span>Tạm tính</span><b>0đ</b></div>
    <input id="note" type="text" maxlength="300" placeholder="Ghi chú cho cả đơn (không cay, ít đá…)">
    <button id="gui" type="button">Gửi bếp</button>
    <button id="dong-khay" type="button">Gọi thêm món</button>
  </div>
</div>

<div id="xong">
  <div class="tick">✓</div>
  <h2>Đã gửi bếp</h2>
  <p id="xong-p">Nhân viên sẽ ra xác nhận đơn của bàn bạn trong ít phút.</p>
  <button id="them-nua" type="button">Gọi thêm món</button>
</div>

<script type="module">
import { initializeApp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInAnonymously, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

/* ═════════ CẤU HÌNH ═════════ */
const CFG = {
  apiKey: "AIzaSyA_kjQ-CdASRkf50Glz3kQajlkD5qGWC4k",
  authDomain: "so-no-cc57a.firebaseapp.com",
  projectId: "so-no-cc57a",
  storageBucket: "so-no-cc57a.firebasestorage.app",
  messagingSenderId: "571694791559",
  appId: "1:571694791559:web:8e409728a520e2d370b122"
};
const CHO_GUI_LAI = 15000;   // chặn bấm gửi liên tục (mili-giây)

/* ═════════ TIỆN ÍCH ═════════ */
const $  = s => document.querySelector(s);
const esc = s => String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const vnd = n => (Number(n)||0).toLocaleString('vi-VN') + 'đ';
const kdau = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
function bao(ic, tieuDe, noiDung, choThuLai){
  $('#top').style.display='none'; $('#ds').innerHTML=''; $('#thanh').classList.remove('on');
  $('#bao').style.display='block';
  $('#bao').innerHTML = '<div class="ic">'+ic+'</div><h2>'+esc(tieuDe)+'</h2><p>'+noiDung+'</p>'
    + (choThuLai ? '<button class="btn-lai" type="button" id="thu-lai">Thử lại</button>' : '');
  const b=$('#thu-lai'); if(b) b.onclick=()=>location.reload();
}

/* ═════════ ĐỌC ĐỊA CHỈ BÀN ═════════ */
const P   = new URLSearchParams(location.search);
const TK  = (P.get('t')||'').trim();
const BAN = (P.get('b')||'').trim();
const KGIO = 'qrgio_' + TK + '_' + BAN;
const KMENU = 'qrmenu_' + TK;
const KLAST = 'qrlast_' + TK + '_' + BAN;

let SHOP=null, MENU=[], GIO=[], dangGui=false;
const tenBan = () => String((SHOP && SHOP.ban && SHOP.ban[BAN]) || BAN);

/* ═════════ GIỎ (giữ lại khi lỡ tắt trình duyệt) ═════════ */
function napGio(){
  try{ const v=JSON.parse(localStorage.getItem(KGIO)||'[]'); if(Array.isArray(v)) GIO=v; }catch(e){ GIO=[]; }
}
function luuGio(){ try{ localStorage.setItem(KGIO, JSON.stringify(GIO)); }catch(e){} }
function slCua(id){ const l=GIO.find(x=>x.i===id); return l?l.q:0; }
function tongTien(){ return GIO.reduce((s,x)=>s+(x.p||0)*(x.q||0),0); }
function tongMon(){ return GIO.reduce((s,x)=>s+(x.q||0),0); }

function themMon(id){
  const m=MENU.find(x=>x.i===id); if(!m) return;
  const l=GIO.find(x=>x.i===id);
  if(l) l.q++; else GIO.push({i:m.i,n:m.n,p:Number(m.p)||0,u:m.u||'',q:1,g:''});
  luuGio(); ve(); veThanh();
}
function botMon(id){
  const k=GIO.findIndex(x=>x.i===id); if(k<0) return;
  GIO[k].q--; if(GIO[k].q<=0) GIO.splice(k,1);
  luuGio(); ve(); veThanh(); if($('#khay').classList.contains('on')) veGio();
}

/* ═════════ VẼ THỰC ĐƠN ═════════ */
function ve(){
  const tu = kdau(($('#tim').value||'').trim());
  const ds = tu ? MENU.filter(m=>kdau(m.n).includes(tu)) : MENU;
  if(!ds.length){
    $('#ds').innerHTML = '<div class="trong">'+(MENU.length?'Không có món nào khớp.':'Quán chưa đưa món nào lên thực đơn.')+'</div>';
    return;
  }
  const nhom=[]; const theo={};
  ds.forEach(m=>{ const g=m.c||'Món khác'; if(!theo[g]){theo[g]=[];nhom.push(g);} theo[g].push(m); });
  let h='';
  nhom.forEach(g=>{
    h += '<div class="nhom">'+esc(g)+'</div>';
    theo[g].forEach(m=>{
      const q=slCua(m.i);
      h += '<div class="mon">'
         + (m.a ? '<img class="mon-a" src="'+esc(m.a)+'" alt="" loading="lazy" onerror="this.remove()">' : '')
         + '<div class="mon-t"><b>'+esc(m.n)+'</b><span>'+vnd(m.p)
         + (m.u ? ' <i>/ '+esc(m.u)+'</i>' : '') + '</span></div>'
         + (q>0
             ? '<div class="dem"><button type="button" data-bot="'+esc(m.i)+'" aria-label="Bớt">−</button><b>'+q+'</b><button type="button" data-them="'+esc(m.i)+'" aria-label="Thêm">+</button></div>'
             : '<button class="them" type="button" data-them="'+esc(m.i)+'" aria-label="Thêm '+esc(m.n)+'">+</button>')
         + '</div>';
    });
  });
  $('#ds').innerHTML = h;
}
function veThanh(){
  const n=tongMon();
  $('#thanh').classList.toggle('on', n>0);
  $('#xem-sl').textContent = n + ' món';
  $('#xem-tien').textContent = vnd(tongTien());
}
function veGio(){
  if(!GIO.length){ dongKhay(); return; }
  $('#gio').innerHTML = GIO.map(l =>
      '<div class="dong"><div class="dong-h">'
    + '<b>'+esc(l.n)+'</b>'
    + '<div class="dem"><button type="button" data-bot="'+esc(l.i)+'">−</button><b>'+l.q+'</b><button type="button" data-them="'+esc(l.i)+'">+</button></div>'
    + '<span class="gia">'+vnd((l.p||0)*(l.q||0))+'</span></div>'
    + '<input class="ghi" type="text" maxlength="80" placeholder="Ghi chú món này…" data-ghi="'+esc(l.i)+'" value="'+esc(l.g||'')+'">'
    + '</div>').join('');
  $('#tong b').textContent = vnd(tongTien());
}
function moKhay(){ veGio(); $('#khay').classList.add('on'); }
function dongKhay(){ $('#khay').classList.remove('on'); }

/* ═════════ BẤM ═════════ */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-them],[data-bot]'); if(!t) return;
  if(t.dataset.them) themMon(t.dataset.them); else botMon(t.dataset.bot);
});
document.addEventListener('input', e=>{
  const t=e.target.closest('[data-ghi]'); if(!t) return;
  const l=GIO.find(x=>x.i===t.dataset.ghi); if(l){ l.g=t.value.slice(0,80); luuGio(); }
});
$('#tim').addEventListener('input', ve);
$('#xem').onclick = moKhay;
$('#dong-khay').onclick = dongKhay;
$('#khay').onclick = e=>{ if(e.target.id==='khay') dongKhay(); };
$('#them-nua').onclick = ()=>{ $('#xong').classList.remove('on'); };

/* ═════════ KHỞI ĐỘNG ═════════ */
let db=null, auth=null;

async function chay(){
  if(!TK || !BAN){
    bao('🔎','Mã bàn chưa đúng','Bạn thử quét lại mã dán trên bàn, hoặc gọi nhân viên giúp một tay.');
    return;
  }
  napGio();

  let app;
  try{
    app  = initializeApp(CFG);
    db   = getFirestore(app);
    auth = getAuth(app);
  }catch(e){
    bao('📶','Chưa mở được thực đơn','Mạng đang chập chờn. Bạn bấm thử lại giúp nhé.', true);
    return;
  }

  /* Đăng nhập vô danh — khách không phải tạo tài khoản gì cả */
  try{ await signInAnonymously(auth); }
  catch(e){
    bao('📶','Chưa mở được thực đơn','Mạng đang chập chờn. Bạn bấm thử lại giúp nhé.', true);
    return;
  }

  /* Đọc thực đơn — chỉ 1 lượt đọc */
  let d=null;
  try{
    const s = await getDoc(doc(db,'shares_qr',TK));
    if(s.exists()) d = s.data();
  }catch(e){ d=null; }

  if(!d){
    /* Rớt mạng: dùng thực đơn đã lưu lần trước cho khách xem tạm */
    let cache=null;
    try{ cache=JSON.parse(localStorage.getItem(KMENU)||'null'); }catch(e){}
    if(cache && Array.isArray(cache.menu) && cache.menu.length){
      d = cache; $('#offline').style.display='block';
    }else{
      bao('🍽️','Quán chưa mở đặt món qua mã này','Bạn gọi nhân viên gọi món giúp nhé.', true);
      return;
    }
  }else{
    try{ localStorage.setItem(KMENU, JSON.stringify({quan:d.quan,ownerUid:d.ownerUid,chiNhanh:d.chiNhanh,ban:d.ban||null,menu:d.menu||[]})); }catch(e){}
  }

  if(d.nhanDon === false){
    bao('🕘','Quán tạm ngưng nhận đơn qua mã QR','Bạn gọi nhân viên gọi món giúp nhé.', true);
    return;
  }

  if(d.ban && typeof d.ban === 'object' && !(BAN in d.ban)){
    bao('🔎','Mã bàn chưa đúng','Bàn này không còn trong sơ đồ của quán. Bạn gọi nhân viên giúp một tay nhé.');
    return;
  }

  SHOP = d;
  MENU = (Array.isArray(d.menu)?d.menu:[]).filter(m=>m && m.i && m.n);
  /* Món đã bỏ khỏi thực đơn thì cũng bỏ khỏi giỏ cũ */
  GIO = GIO.filter(l=>MENU.some(m=>m.i===l.i)); luuGio();

  $('#bao').style.display='none';
  $('#top').style.display='block';
  $('#quan').textContent = d.quan || 'Thực đơn';
  $('#ban').textContent  = 'Bàn ' + tenBan();
  ve(); veThanh();
}

/* ═════════ GỬI ĐƠN ═════════ */
$('#gui').onclick = async ()=>{
  if(dangGui || !GIO.length) return;

  let truoc=0; try{ truoc=Number(localStorage.getItem(KLAST))||0; }catch(e){}
  const con = CHO_GUI_LAI - (Date.now()-truoc);
  if(con > 0){
    alert('Đơn vừa gửi xong rồi. Chờ ' + Math.ceil(con/1000) + ' giây nữa hãy gửi tiếp nhé.');
    return;
  }

  dangGui = true;
  $('#gui').disabled = true;
  $('#gui').textContent = 'Đang gửi…';

  const don = {
    token:    TK,
    ownerUid: String(SHOP.ownerUid||''),
    chiNhanh: String(SHOP.chiNhanh||'main'),
    banId:    BAN,
    banTen:   tenBan().slice(0,60),
    items:    GIO.slice(0,40).map(l=>({
                i:String(l.i), n:String(l.n).slice(0,80),
                p:Number(l.p)||0, q:Number(l.q)||1,
                u:String(l.u||'').slice(0,20), g:String(l.g||'').slice(0,80)
              })),
    tong:     tongTien(),
    ghiChu:   String($('#note').value||'').slice(0,300),
    khach:    '',
    tt:       'cho',
    taoLuc:   serverTimestamp(),
    tsClient: Date.now()
  };

  try{
    await addDoc(collection(db,'qr_don'), don);
    try{ localStorage.setItem(KLAST, String(Date.now())); }catch(e){}
    GIO=[]; luuGio(); $('#note').value='';
    ve(); veThanh(); dongKhay();
    $('#xong-p').textContent = 'Nhân viên sẽ ra xác nhận đơn của bàn ' + tenBan() + ' trong ít phút.';
    $('#xong').classList.add('on');
  }catch(e){
    const ma = (e && e.code) || '';
    if(ma === 'permission-denied'){
      alert('Quán đang tạm ngưng nhận đơn qua mã QR. Bạn gọi nhân viên gọi món giúp nhé.');
    }else{
      alert('Chưa gửi được — mạng đang chập chờn. Giỏ hàng vẫn còn nguyên, bạn bấm gửi lại nhé.');
    }
  }finally{
    dangGui = false;
    $('#gui').disabled = false;
    $('#gui').textContent = 'Gửi bếp';
  }
};

chay();
</script>
<!-- ═══════════════ XEM ẢNH LỚN — khách chạm ảnh là bung ra toàn màn hình (khối độc lập · namespace lba-) ═══════════════
     • Chạm ảnh món trong thực đơn ⇒ ảnh lớn toàn màn hình, kèm tên món.
     • Phóng to: chụm 2 ngón, hoặc chạm 2 lần vào ảnh (máy tính: bấm đúp / lăn chuột). Đang phóng to thì kéo để xem từng góc.
     • Đóng: nút ✕ · chạm ra ngoài ảnh · nút Quay lại của điện thoại (vẫn ở lại trang, giỏ hàng còn nguyên) · phím Esc.
     • Chỉ đọc ảnh đang hiện sẵn trên trang — không đụng giỏ hàng, đơn hàng, Firebase. Khối này có trục trặc gì thì

<script>
(function(){
'use strict';
if(window.__LBA__) return; window.__LBA__ = true;
try{

/* ═════════ CẤU HÌNH ═════════ */
var CHON    = 'img.mon-a, #bt-a';   /* chạm ảnh nào thì bung ra (#bt-a = ảnh trong khung chọn size/màu) */
var TOI_DA  = 4;                    /* phóng to tối đa (lần) */
var HAI_LAN = 2.5;                  /* chạm 2 lần vào ảnh ⇒ phóng to bấy nhiêu lần */
/* ═══════════════════════════ */

var css = [
  'img.mon-a,#bt-a{cursor:zoom-in}',
  '.lba{position:fixed;left:0;top:0;right:0;bottom:0;z-index:1000;display:none;background:rgba(0,0,0,.92);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:contain}',
  '.lba.on{display:block;animation:lbaHien .18s ease-out}',
  '.lba:focus{outline:none}',
  '@keyframes lbaHien{from{opacity:0}to{opacity:1}}',
  '.lba-a{position:absolute;left:8px;right:8px;top:calc(60px + env(safe-area-inset-top,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));margin:auto;width:auto;height:auto;max-width:calc(100% - 16px);max-height:calc(100% - 144px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border-radius:6px;background:#fff;transform-origin:50% 50%;-webkit-user-drag:none;cursor:zoom-in}',
  '.lba-a.muot{transition:transform .22s ease-out}',
  '.lba.zoom .lba-a{cursor:grab}',
  '.lba.cho .lba-a,.lba.loi .lba-a{visibility:hidden}',
  '.lba-x{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:2;width:44px;height:44px;padding:0;border:none;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}',

  '.lba.zoom .lba-cap{opacity:0}'

var st = document.createElement('style');
st.id = 'lba-css';
st.textContent = css;
(document.head || document.documentElement).appendChild(st);

/* R = khung · IM = ảnh lớn · S/TX/TY = độ phóng và độ dịch · BW/BH/CX/CY = cỡ và tâm ảnh lúc chưa phóng */
var R = null, IM = null, TT = null, TEN = null, GOI = null, NUT = null;
var MO = false, LAN = 0, XONG = -1, MO_LUC = 0, CHAN_MO = 0, CHAN_CLICK = 0, T_MUOT = 0;
var TOK = 0, DAY = false, TRUOC = null;
var S = 1, TX = 0, TY = 0, BW = 0, BH = 0, CX = 0, CY = 0, VW = 0, VH = 0;
var PT = {}, G = null, KEO = false, RECT = null, TAP = null;

/* ───────── tiện ích ───────── */
function kep(v, a, b){ return v < a ? a : (v > b ? b : v); }
function trong(r, x, y){ return !!(r && r.width > 0 && r.height > 0 && x >= r.left && x <= r.right && y >= r.top && y <= r.bottom); }
function dsPT(){ var a = [], k; for(k in PT) if(Object.prototype.hasOwnProperty.call(PT, k)) a.push(PT[k]); return a; }
function laCham(){ try{ return ('ontouchstart' in window) || navigator.maxTouchPoints > 0; }catch(e){ return false; } }
function trangThai(){ try{ return history.state; }catch(e){ return null; } }
function tenCua(img){
  try{
    if(img.id === 'bt-a'){ var h = document.getElementById('bt-ten'); return h ? h.textContent : ''; }
    var the = img.closest('.mon'), b = the ? the.querySelector('.mon-t b') : null;
    return b ? b.textContent : '';
  }catch(e){ return ''; }
}

/* ───────── phóng · dịch ảnh ───────── */
function ap(){
  IM.style.transform = (S === 1 && TX === 0 && TY === 0) ? '' : 'translate(' + TX + 'px,' + TY + 'px) scale(' + S + ')';
  R.classList.toggle('zoom', S > 1.01);
}
function doDac(){                                     /* đo ảnh lúc chưa phóng */
  var cu = IM.style.transform; IM.style.transform = '';
  BW = IM.offsetWidth; BH = IM.offsetHeight;
  CX = IM.offsetLeft + BW / 2; CY = IM.offsetTop + BH / 2;
  VW = R.clientWidth; VH = R.clientHeight;
  IM.style.transform = cu;
}
function gioiHan(){                                   /* ảnh nhỏ hơn màn hình thì nằm giữa; lớn hơn thì không kéo trôi khỏi mép */
  var w = S * BW, h = S * BH;
  TX = (w <= VW) ? kep(0, w / 2 - CX, VW - CX - w / 2) : kep(TX, VW - CX - w / 2, w / 2 - CX);
  TY = (h <= VH) ? kep(0, h / 2 - CY, VH - CY - h / 2) : kep(TY, VH - CY - h / 2, h / 2 - CY);
}
/* phóng tới s1: điểm ảnh đang nằm ở (fx,fy) lúc độ phóng s0 / độ dịch (t0x,t0y) sẽ nằm đúng dưới (gx,gy) */
function zoomTai(s1, fx, fy, gx, gy, s0, t0x, t0y){
  if(!BW || !BH) return;
  s1 = kep(s1, 1, TOI_DA);
  var ux = (fx - CX - t0x) / s0, uy = (fy - CY - t0y) / s0;
  S = s1; TX = gx - CX - s1 * ux; TY = gy - CY - s1 * uy;
  gioiHan(); ap();
}
function muot(){ IM.classList.add('muot'); clearTimeout(T_MUOT); T_MUOT = setTimeout(function(){ if(IM) IM.classList.remove('muot'); }, 260); }
function dungMuot(){ clearTimeout(T_MUOT); IM.classList.remove('muot'); }
function haiLan(x, y){                                /* chạm 2 lần: phóng to đúng chỗ chạm · đang phóng thì thu về */
  if(!BW) return;
  CHAN_CLICK = Date.now() + 400;
  muot();
  if(S > 1.01){ S = 1; TX = 0; TY = 0; ap(); }
  else zoomTai(Math.min(HAI_LAN, TOI_DA), x, y, x, y, S, TX, TY);
}

/* ───────── ngón tay / chuột ───────── */
function batDau(){                                    /* chốt mốc cử chỉ theo số ngón đang chạm */
  var ds = dsPT();
  if(ds.length >= 2){
    var a = ds[0], b = ds[1];
    KEO = true;
    G = { k: 2, d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: S, tx0: TX, ty0: TY, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  }else if(ds.length === 1){
    G = { k: 1, x0: ds[0].x, y0: ds[0].y, t0: 0, tx0: TX, ty0: TY };
  }else G = null;
}
function cham(e){
  if(!MO) return;
  if(e.target && e.target.closest && e.target.closest('.lba-x')) return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  try{ R.setPointerCapture(e.pointerId); }catch(er){}
  PT[e.pointerId] = { x: e.clientX, y: e.clientY };
  dungMuot();
  var n = dsPT().length;
  if(n === 1){ KEO = false; RECT = (XONG === LAN) ? IM.getBoundingClientRect() : null; }   /* ảnh chưa hiện ⇒ không có "vùng ảnh" */
  batDau();
  if(n === 1 && G) G.t0 = Date.now();
}
function di(e){
  if(!MO || !PT[e.pointerId]) return;
  PT[e.pointerId] = { x: e.clientX, y: e.clientY };
  if(!G) return;
  var ds = dsPT();
  if(G.k === 2 && ds.length >= 2){
    var a = ds[0], b = ds[1];
    zoomTai(G.s0 * (Math.hypot(a.x - b.x, a.y - b.y) || 1) / G.d0, G.mx, G.my, (a.x + b.x) / 2, (a.y + b.y) / 2, G.s0, G.tx0, G.ty0);
  }else if(G.k === 1 && ds.length === 1){
    var dx = e.clientX - G.x0, dy = e.clientY - G.y0;
    if(!KEO && Math.abs(dx) + Math.abs(dy) > 10) KEO = true;
    if(KEO && S > 1.01 && BW){ TX = G.tx0 + dx; TY = G.ty0 + dy; gioiHan(); ap(); }
  }
}
function tha(e){
  if(!PT[e.pointerId]) return;
  delete PT[e.pointerId];
  try{ R.releasePointerCapture(e.pointerId); }catch(er){}
  if(dsPT().length){ batDau(); return; }              /* còn ngón trên màn hình ⇒ cử chỉ chạy tiếp */
  var g = G; G = null;

  if(TAP && nay - TAP.t < 350 && Math.abs(x - TAP.x) < 40 && Math.abs(y - TAP.y) < 40){ TAP = null; haiLan(x, y); }
  else TAP = { t: nay, x: x, y: y };
}
/* Đóng khi chạm ra ngoài ảnh bằng sự kiện click (không đóng ở lúc nhấc ngón) ⇒ cú chạm đó không lọt xuống
   nút + / nút Đặt nằm bên dưới. Vị trí ảnh lấy lúc vừa đặt ngón, nên chạm 2 lần để thu nhỏ không bị đóng nhầm. */
function bam(e){
  if(!MO) return;
  if(e.target && e.target.closest && e.target.closest('.lba-x')) return;
  var nay = Date.now();
  if(KEO || nay < CHAN_CLICK || nay - MO_LUC < 400) return;
  if(!trong(XONG === LAN ? (RECT || IM.getBoundingClientRect()) : null, e.clientX, e.clientY)) dong(false);   /* đang tải / lỗi ⇒ chạm đâu cũng đóng */
}
function cuon(e){                                     /* máy tính: lăn chuột để phóng to / thu nhỏ */
  if(!MO) return;
  e.preventDefault();
  if(!BW) return;
  var dy = e.deltaY * (e.deltaMode === 1 ? 16 : (e.deltaMode === 2 ? 400 : 1));
  if(!dy) return;
  dungMuot();
  zoomTai(S * Math.exp(-dy * 0.0015), e.clientX, e.clientY, e.clientX, e.clientY, S, TX, TY);
}
function phim(e){
  if(!MO) return;
  var k = e.key || '';
  if(k === 'Escape' || k === 'Esc'){ e.preventDefault(); e.stopPropagation(); dong(false); }
  else if(k === 'Tab'){ e.preventDefault(); try{ NUT.focus(); }catch(er){} }
}
function doLai(){                                     /* xoay máy / đổi cỡ cửa sổ ⇒ đo lại, về cỡ vừa màn hình */
  if(!MO || XONG !== LAN) return;
  dungMuot();
  S = 1; TX = 0; TY = 0; IM.style.transform = '';
  doDac(); ap();
}

/* ───────── dựng khung (1 lần, lúc chạm ảnh đầu tiên) ───────── */
function dung(){
  if(R) return;
  R = document.createElement('div');
  R.className = 'lba';
  R.setAttribute('role', 'dialog');
  R.setAttribute('aria-modal', 'true');
  R.setAttribute('aria-label', 'Xem ảnh lớn');
  R.setAttribute('tabindex', '-1');
  R.innerHTML = '<img class="lba-a" alt="" draggable="false">'
              + '<div class="lba-tt" aria-live="polite"></div>'
              + '<div class="lba-cap"><span class="lba-ten"></span><span class="lba-goi"></span></div>'
              + '<button type="button" class="lba-x" aria-label="Đóng ảnh">✕</button>';
  document.body.appendChild(R);
  IM = R.querySelector('.lba-a'); TT = R.querySelector('.lba-tt');
  TEN = R.querySelector('.lba-ten'); GOI = R.querySelector('.lba-goi'); NUT = R.querySelector('.lba-x');
  NUT.addEventListener('click', function(){ dong(false); });
  R.addEventListener('click', bam);
  R.addEventListener('pointerdown', cham);
  R.addEventListener('pointermove', di);
  R.addEventListener('pointerup', tha);
  R.addEventListener('pointercancel', tha);
  R.addEventListener('wheel', cuon, { passive: false });
  R.addEventListener('touchmove', function(e){ if(MO && e.cancelable) e.preventDefault(); }, { passive: false });

    R.addEventListener(n, function(e){ if(e.cancelable) e.preventDefault(); });   /* iPhone: chặn phóng cả trang */
  });
  IM.addEventListener('dragstart', function(e){ e.preventDefault(); });
}

/* ───────── mở · đóng ───────── */
function mo(src, ten){
  dung();
  LAN++; var lan = LAN;
  MO = true; MO_LUC = Date.now();
  S = 1; TX = 0; TY = 0; BW = 0; BH = 0; PT = {}; G = null; KEO = false; RECT = null; TAP = null;
  dungMuot(); IM.style.transform = '';
  R.classList.remove('zoom', 'loi'); R.classList.add('cho');
  TT.textContent = '';
  ten = String(ten == null ? '' : ten).replace(/\s+/g, ' ').trim().slice(0, 140);
  TEN.textContent = ten; TEN.style.display = ten ? '' : 'none';
  GOI.textContent = laCham() ? 'Chụm 2 ngón hoặc chạm 2 lần vào ảnh để phóng to' : 'Bấm đúp hoặc lăn chuột để phóng to';
  IM.setAttribute('alt', ten || 'Ảnh sản phẩm');
  TRUOC = document.activeElement;
  R.classList.add('on');
  IM.onload = function(){ daTai(lan); };
  IM.onerror = function(){
    if(lan !== LAN || !MO) return;
    R.classList.remove('cho'); R.classList.add('loi');
    TT.textContent = 'Chưa tải được ảnh — mạng đang yếu. Bạn đóng lại rồi chạm vào ảnh lần nữa nhé.';
  };
  IM.setAttribute('src', src);
  if(IM.complete && IM.naturalWidth > 0) daTai(lan);
  setTimeout(function(){ if(lan === LAN && MO && R.classList.contains('cho')) TT.textContent = 'Đang tải ảnh…'; }, 300);
  document.addEventListener('keydown', phim, true);
  window.addEventListener('resize', doLai);
  try{ R.focus({ preventScroll: true }); }catch(e){}       /* trỏ vào khung (không viền); bàn phím: Tab ⇒ nút ✕, Esc ⇒ đóng */
  /* Nút Quay lại của điện thoại: đóng ảnh, KHÔNG rời trang */
  DAY = false;
  try{ TOK = Date.now() + Math.random(); history.pushState({ lbaAnh: TOK }, ''); DAY = true; }catch(e){ DAY = false; }
}
function daTai(lan){
  if(lan !== LAN || !MO || XONG === lan || !(IM.naturalWidth > 0)) return;
  XONG = lan;
  R.classList.remove('cho', 'loi');
  TT.textContent = '';
  doDac(); S = 1; TX = 0; TY = 0; ap();
}
function dong(tuBack){
  if(!MO) return;
  MO = false; LAN++;
  PT = {}; G = null; TAP = null; RECT = null;
  dungMuot();
  R.classList.remove('on', 'zoom', 'cho', 'loi');
  IM.style.transform = '';
  IM.onload = null; IM.onerror = null;
  TT.textContent = '';
  document.removeEventListener('keydown', phim, true);
  window.removeEventListener('resize', doLai);
  var day = DAY; DAY = false;
  if(!tuBack && day){                                 /* đóng bằng ✕ / chạm ngoài / Esc ⇒ gỡ đúng bước lịch sử đã thêm */
    var s = trangThai();
    if(s && s.lbaAnh === TOK){ CHAN_MO = Date.now() + 450; try{ history.back(); }catch(e){} }
  }
  var t = TRUOC; TRUOC = null;
  try{
    if(t && t !== document.body && t !== document.documentElement && typeof t.focus === 'function'
       && !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || '') && document.contains(t)) t.focus({ preventScroll: true });
  }catch(e){}
}

window.addEventListener('popstate', function(){
  if(!MO) return;
  var s = trangThai();
  if(!(s && s.lbaAnh === TOK)) dong(true);
});

/* Chạm vào ảnh hàng ⇒ mở. Không có gì khác bị chặn: nút +, nút Đặt, chọn size… vẫn chạy như cũ. */
document.addEventListener('click', function(e){
  try{
    if(MO) return;
    var t = e.target, img = (t && t.closest) ? t.closest(CHON) : null;
    if(!img || img.tagName !== 'IMG') return;
    if(Date.now() < CHAN_MO) return;
    var src = img.currentSrc || img.getAttribute('src') || '';
    if(!src || (img.complete && !(img.naturalWidth > 0))) return;        /* ảnh hỏng / không có ảnh ⇒ không mở */
    mo(src, tenCua(img));
  }catch(er){ try{ console.warn('[lba] chưa mở được ảnh lớn', er); }catch(_){} }
});

}catch(e){ try{ console.warn('[lba] khối xem ảnh lớn lỗi khởi động', e); }catch(_){} }
})();
</script>

<!-- ═══════════════ NHẮN TIN VỚI CỬA HÀNG (khối độc lập · namespace chk-) ═══════════════
     Khách hỏi hàng, hỏi giá, thỏa thuận đơn ngay trên link — cửa hàng trả lời trong app.
     • CHỈ THÊM: không sửa một dòng nào của trang. Khối này lỗi thì việc đặt hàng vẫn chạy y nguyên.
     • Mỗi khách 1 cuộc riêng: qr_chat/{mã link}_{uid khách} — không ai khác đọc được.
     • Khách chỉ xem hàng ⇒ chỉ 1 lượt đọc công tắc nhắn tin (nhớ 30 phút), không đọc tin nhắn nào.
     • Thẻ "📋 Chốt đơn" của cửa hàng có nút "✅ Đồng ý" — lưu lại làm bằng chứng thỏa thuận.

function ms(v){ try{ if(v && typeof v.toMillis === 'function') return v.toMillis(); }catch(e){} return (typeof v === 'number') ? v : 0; }
const hai = n => (n < 10 ? '0' : '') + n;
function gio(t){ const d = new Date(t); return hai(d.getHours()) + ':' + hai(d.getMinutes()); }
function nhanNgay(t){
  const d = new Date(t), h = new Date(), x = new Date(h.getFullYear(), h.getMonth(), h.getDate()).getTime();
  const n = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  if(n === x) return 'Hôm nay';
  if(n === x - 86400000) return 'Hôm qua';
  return hai(d.getDate()) + '/' + hai(d.getMonth() + 1) + '/' + d.getFullYear();
}

function shopTuBoNho(){
  const m = docJ(KMENU, null);
  return (m && typeof m === 'object' && m.ownerUid) ? m : null;
}
const tenBan = () => String((S && S.ban && S.ban[BAN]) || BAN);
function khoaNhap(){ return lyDoKhoa || (CHAT === false ? 'Cửa hàng đang tạm tắt nhắn tin.' : ''); }
function napChat(){ const v = docJ(KCFG, null); if(v && typeof v.c === 'boolean' && Date.now() - (Number(v.t) || 0) < 1800000) CHAT = v.c; }
function ghiChat(c){ CHAT = c; LS.set(KCFG, JSON.stringify({ c: c, t: Date.now() })); }
/* Đọc công tắc nhắn tin trên link (trường 'chat'): 1 lượt, nhớ 30 phút. Đọc lỗi ⇒ coi như BẬT. */
async function kiemChat(ep){
  if(dangKiemChat || !db || (!ep && CHAT !== null)) return;
  dangKiemChat = true; lanKiemChat = Date.now();
  try{ const s = await getDoc(doc(db, 'shares_qr', TK)); if(s.exists()) ghiChat((s.data() || {}).chat !== false); }
  catch(e){ if(CHAT === null) CHAT = true; }
  dangKiemChat = false;
  capNhatNut(); if(KHUNG_MO) veTatCa();
}
function sdtShop(){ return String((S && S.cfg && S.cfg.sdt) || '').replace(/[^0-9+]/g, '').slice(0, 15); }
function hoSo(){
  let ten = '', sdt = '';
  if(LA_ONL){ const kh = docJ('olkhach_v1', null) || {}; ten = kh.ten || ''; sdt = kh.sdt || ''; }
  if(!String(ten).trim()) ten = LS.get(KTEN) || '';
  return { ten: cat(String(ten).trim(), 60), sdt: cat(String(sdt).replace(/[^0-9+]/g, ''), 15),
           banId: LA_ONL ? '' : BAN, banTen: LA_ONL ? '' : cat(tenBan(), 60) };
}
function chuaDoc(){ return !!(CUOC && CUOC.cuoiTu === 'c' && ms(CUOC.cuoi) > ms(CUOC.docK)); }

  const top = $('#top');
  if(!top || getComputedStyle(top).display === 'none') return true;
  if(document.querySelector('#khay.on,#bt.on,#dp.on,#xong.on,.lba.on')) return true;

}
function datViTri(){
  const th = $('#thanh');
  let v = 'calc(16px + env(safe-area-inset-bottom,0px))';
  if(th && th.classList.contains('on')){
    const r = th.getBoundingClientRect();
    if(r.height > 0 && r.top < innerHeight) v = Math.max(12, Math.round(innerHeight - r.top + 10)) + 'px';
  }
  if(v !== nutVT){ nutVT = v; NUT.style.bottom = v; }
}
function canNghe(){ return !!TID && (KHUNG_MO || LS.get(KCO + TID) === '1' || (LA_ONL && !!LS.get(KDON))); }
function capNhatNut(){
  if(!S) S = shopTuBoNho();
  if(db && !unCuoc && canNghe()) ngheCuoc();
  if(db && KHUNG_MO && CUOC && !unTin) ngheTin();
  if(KHUNG_MO && CHAT === false && Date.now() - lanKiemChat > 60000) kiemChat(true);   /* đang mở khung mà thấy tắt ⇒ 1 phút hỏi lại 1 lần */
  const dung = !!(S && UID && db) && (CHAT === true || !!CUOC);
  const hien = dung && !biChe();
  if(document.body.classList.contains('chk-co') !== dung) document.body.classList.toggle('chk-co', dung);
  NUT.classList.toggle('on', hien);
  NUT.classList.toggle('moi', chuaDoc());
  if(hien) datViTri();
  const xn = $('#chk-xong'); if(xn){ const d = dung ? '' : 'none'; if(xn.style.display !== d) xn.style.display = d; }
}

/* ───────── NGHE CUỘC TRÒ CHUYỆN ───────── */
function ngheCuoc(){
  if(unCuoc || !TID || !db || Date.now() < treCuoc) return;
  const tid = TID;
  try{
    unCuoc = onSnapshot(doc(db, 'qr_chat', tid), s => {
      if(tid !== TID) return;
      loiCuoc = 0; maLoiCuoc = ''; CUOC_SAN = true;
      CUOC = s.exists() ? (s.data({ serverTimestamps: 'estimate' }) || null) : null;
      if(CUOC) LS.set(KCO + tid, '1');
      khiCuocDoi();
    }, e => {
      if(tid !== TID) return;
      unCuoc = null; CUOC_SAN = false; loiCuoc++;
      maLoiCuoc = (e && e.code) || 'loi';
      treCuoc = Date.now() + Math.min(60000, 2000 * Math.pow(2, Math.min(loiCuoc, 5)));
      if(KHUNG_MO) veTatCa();
    });
  }catch(e){ unCuoc = null; }
}
function khiCuocDoi(){
  if(CUOC && KHUNG_MO) ngheTin();
  if(chuaDoc()){
    if(KHUNG_MO && !document.hidden) danhDauXem();
    else{
      const t = ms(CUOC.cuoi), da = Number(LS.get(KBAO + TID)) || 0;
      if(t > da){ LS.set(KBAO + TID, String(t)); baoMoi(CUOC.cuoiNd); }
    }
  }
  capNhatNut();
  if(KHUNG_MO) veTatCa();
}
function ngheTin(){
  if(unTin || !TID || !db || !CUOC || Date.now() < treTin) return;
  const tid = TID;
  try{
    unTin = onSnapshot(query(collection(db, 'qr_chat', tid, 'tin'), orderBy('luc', 'desc'), limit(80)), s => {
      if(tid !== TID) return;
      loiTin = 0; TIN_SAN = true;
      TIN = s.docs.map(d => { const x = d.data({ serverTimestamps: 'estimate' }) || {}; x.id = d.id; return x; })
                  .sort((a, b) => (ms(a.luc) - ms(b.luc)) || (a.id < b.id ? -1 : 1));
      for(let i = CHO.length - 1; i >= 0; i--) if(CHO[i].tt === 'xong' && TIN.some(t => t.id === CHO[i].id)) CHO.splice(i, 1);
      veTin();
    }, e => {
      if(tid !== TID) return;
      unTin = null; loiTin++;
      treTin = Date.now() + Math.min(60000, 2000 * Math.pow(2, Math.min(loiTin, 5)));
    });
  }catch(e){ unTin = null; }
}
function boNghe(){
  try{ if(unCuoc) unCuoc(); }catch(e){} unCuoc = null;
  try{ if(unTin) unTin(); }catch(e){} unTin = null;
}

function danhDauXem(){
  if(!chuaDoc() || !TID || !db || docKCho) return;
  const tre = docKHen - Date.now();
  if(tre > 0){ if(!docKTimer) docKTimer = setTimeout(() => { docKTimer = 0; danhDauXem(); }, tre + 50); return; }
  docKCho = true; docKHen = Date.now() + 1500;
  updateDoc(doc(db, 'qr_chat', TID), { docK: serverTimestamp() })
    .catch(() => {}).then(() => { docKCho = false; });
}

/* ───────── GỬI TIN ───────── */
function guiTin(nd, loai, ref){
  nd = cat(String(nd == null ? '' : nd).trim(), 500);
  if(!nd || !db || !TID || !S || khoaNhap()) return false;
  let id;
  try{ id = doc(collection(db, 'qr_chat', TID, 'tin')).id; }catch(e){ return false; }
  CHO.push({ id: id, nd: nd, loai: loai || 'tx', ref: ref ? cat(ref, 60) : '', tt: 'cho', ts: Date.now(), loi: '' });
  veTin(true);
  chayHang();
  return true;
}
async function chayHang(){
  if(dangGui) return;
  const x = CHO.find(c => c.tt === 'cho');
  if(!x) return;
  dangGui = true;
  const tid = TID;
  try{
    const doi = lanGui + DAN_CACH - Date.now();
    if(doi > 0) await ngu(doi);
    await guiMot(x, tid);
    x.tt = 'xong'; lanGui = Date.now();
    LS.set(KCO + tid, '1');
    if(!unCuoc) ngheCuoc();
    if(CUOC && !unTin && KHUNG_MO) ngheTin();
  }catch(e){
    lanGui = Date.now();
    x.tt = 'loi';
    x.loi = await lyDo(e, tid);
  }
  dangGui = false;
  if(tid === TID){ veTatCa(); if(CHO.some(c => c.tt === 'cho')) setTimeout(chayHang, 0); }
}
async function guiMot(x, tid){
  for(let lan = 0; lan < 2; lan++){
    let co;
    if(CUOC_SAN && lan === 0) co = !!CUOC;
    else{
      const s = await getDoc(doc(db, 'qr_chat', tid));
      co = s.exists();
      if(tid === TID){ CUOC = co ? (s.data({ serverTimestamps: 'estimate' }) || null) : null; }
    }
    try{ await ghiLo(x, co, tid); return; }
    catch(e){
      const ma = (e && e.code) || '';
      if(lan === 0 && /permission-denied|not-found|failed-precondition|aborted|already-exists/.test(ma)){
        await ngu(DAN_CACH);
        try{ const m = await getDoc(doc(db, 'qr_chat', tid, 'tin', x.id)); if(m.exists()) return; }catch(e2){}
        continue;
      }
      throw e;
    }
  }
}
async function ghiLo(x, co, tid){
  const b = writeBatch(db);
  const cref = doc(db, 'qr_chat', tid);
  const now = serverTimestamp();
  const xem = cat((x.loai === 'don' ? '🧾 ' : x.loai === 'ok' ? '✅ ' : '') + x.nd, 120);
  const hs = hoSo();
  if(!co){
    b.set(cref, { token: TK, ownerUid: cat(S.ownerUid, 80), chiNhanh: cat(S.chiNhanh || 'main', 80), kieu: TRANG,
                  banId: hs.banId, banTen: hs.banTen, khachUid: UID, ten: hs.ten, sdt: hs.sdt,
                  tao: now, cuoi: now, cuoiTu: 'k', cuoiNd: xem, cuoiK: now, soK: 1, mo: true, chan: false, docK: now });
  }else{
    const u = { cuoi: now, cuoiTu: 'k', cuoiNd: xem, cuoiK: now, soK: increment(1), mo: true, docK: now };
    if(CUOC){
      if(hs.ten && hs.ten !== CUOC.ten) u.ten = hs.ten;
      if(hs.sdt && hs.sdt !== CUOC.sdt) u.sdt = hs.sdt;
      if(!LA_ONL && hs.banId && hs.banId !== CUOC.banId){ u.banId = hs.banId; u.banTen = hs.banTen; }
    }
    b.update(cref, u);
  }
  const m = { tu: 'k', nd: x.nd, loai: x.loai, luc: now, uid: UID };
  if(x.ref) m.ref = x.ref;
  b.set(doc(db, 'qr_chat', tid, 'tin', x.id), m);
  await b.commit();
}
async function lyDo(e, tid){
  const ma = (e && e.code) || '';
  if(ma !== 'permission-denied') return 'Chưa gửi được (mạng chập chờn).';
  try{
    const c = await getDoc(doc(db, 'qr_chat', tid));
    if(c.exists()){
      const d = c.data() || {};
      if(d.chan === true){ lyDoKhoa = 'Cửa hàng hiện không nhận tin nhắn từ bạn.'; return lyDoKhoa; }
      if((Number(d.soK) || 0) >= 500){ lyDoKhoa = 'Cuộc trò chuyện đã quá dài — bạn gọi điện cho cửa hàng giúp nhé.'; return lyDoKhoa; }
    }
  }catch(e2){}
  try{
    const s = await getDoc(doc(db, 'shares_qr', TK));
    const d = s.exists() ? (s.data() || {}) : null;
    if(!d){ lyDoKhoa = 'Link này không còn dùng được nữa.'; return lyDoKhoa; }
    if(d.chat === false){ ghiChat(false); return 'Cửa hàng đang tạm tắt nhắn tin.'; }
    ghiChat(true);
  }catch(e3){}
  return 'Cửa hàng tạm thời chưa nhận được tin nhắn. Bạn gọi điện cho cửa hàng giúp nhé.';
}

/* ───────── VẼ ───────── */
function veTin(cuon){
  if(!KHUNG_MO) return;
  const sat = DS.scrollHeight - DS.scrollTop - DS.clientHeight < 90;
  const ds = TIN.slice(), co = {};
  TIN.forEach(t => { co[t.id] = 1; });
  CHO.forEach(c => { if(!co[c.id]) ds.push({ id: c.id, tu: 'k', nd: c.nd, loai: c.loai, ref: c.ref, _tt: c.tt, _loi: c.loi, _ts: c.ts }); });
  let h = '';
  if(!ds.length){
    if((!CUOC_SAN && !maLoiCuoc) || (CUOC && !TIN_SAN)) h = '<div class="chk-trong">Đang mở tin nhắn…</div>';
    else h = '<div class="chk-trong"><i>👋</i>Chào bạn! Nhắn cho <b>' + esc((S && S.quan) || (LA_ONL ? 'cửa hàng' : 'quán'))
           + '</b> để hỏi hàng, hỏi giá hay thỏa thuận đơn.<br><small>Tin nhắn chỉ bạn và cửa hàng xem được.</small></div>';
  }else{
    const dongY = {};
    ds.forEach(t => { if(t.tu === 'k' && t.loai === 'ok' && t.ref) dongY[t.ref] = t._tt || 'xong'; });
    let cuoiK = -1;
    ds.forEach((t, i) => { if(t.tu === 'k' && !t._tt) cuoiK = i; });
    let ngayTr = '';
    ds.forEach((t, i) => {
      const tms = t._tt ? t._ts : (ms(t.luc) || Date.now());
      const ng = nhanNgay(tms);
      if(ng !== ngayTr){ h += '<div class="chk-ngay">' + ng + '</div>'; ngayTr = ng; }
      const toi = t.tu === 'k';
      let noi;
      if(t.loai === 'chot'){
        const dy = dongY[t.id];
        noi = '<div class="chk-the"><h4>📋 Cửa hàng chốt đơn</h4>'
            + ((typeof t.tong === 'number') ? '<div class="chk-tg">Tổng: <b>' + vnd(t.tong) + '</b></div>' : '')
            + '<div class="chk-nd">' + esc(t.nd) + '</div>'
            + (dy ? '<div class="chk-ok">' + (dy === 'cho' ? '⏳ Đang gửi đồng ý…' : '✅ Bạn đã đồng ý') + '</div>'
                  : '<button type="button" class="chk-dy" data-chk-dy="' + esc(t.id) + '"' + (khoaNhap() ? ' disabled' : '') + '>✅ Đồng ý</button>')
            + '</div>';
      }else{
        noi = '<div class="chk-b' + (t.loai === 'don' ? ' don' : '') + '">' + (t.loai === 'don' ? '🧾 ' : t.loai === 'ok' ? '✅ ' : '') + esc(t.nd) + '</div>';
      }
      let duoi = '';
      if(t._tt === 'cho') duoi = '<div class="chk-g">Đang gửi…</div>';
      else if(t._tt === 'loi') duoi = '<div class="chk-loi">⚠️ ' + esc(t._loi || 'Chưa gửi được.')
          + (khoaNhap() ? '' : ' <button type="button" data-chk-lai="' + esc(t.id) + '">Gửi lại</button>')
          + '<button type="button" data-chk-bo="' + esc(t.id) + '">Bỏ</button></div>';
      else duoi = '<div class="chk-g">' + gio(tms) + ((i === cuoiK && CUOC && ms(CUOC.docC) >= ms(t.luc)) ? ' · Đã xem' : '') + '</div>';
      h += '<div class="chk-r' + (toi ? ' toi' : '') + '">' + noi + duoi + '</div>';
    });
  }
  DS.innerHTML = h;
  if(cuon || sat || dauLan){ DS.scrollTop = DS.scrollHeight; dauLan = false; }
}
function veKhoa(){
  lyDoKhoaCapNhat();
  let tb = '';
  if(khoaNhap()) tb = khoaNhap();
  else if(maLoiCuoc === 'permission-denied') tb = 'Tin nhắn chưa sẵn sàng — bạn thử lại sau ít phút nhé.';
  else if(maLoiCuoc || (typeof navigator.onLine === 'boolean' && !navigator.onLine)) tb = 'Đang mất mạng — có mạng lại tin sẽ tự gửi.';
  const sdt = LA_ONL ? sdtShop() : '';
  if(tb && sdt && khoaNhap()) tb += ' Gọi: ' + sdt;
  CHAN.textContent = tb;
  CHAN.classList.toggle('on', !!tb);
  TA.disabled = !!khoaNhap();
  GUI.disabled = !!khoaNhap();
}
function lyDoKhoaCapNhat(){
  if(CUOC && CUOC.chan === true) lyDoKhoa = 'Cửa hàng hiện không nhận tin nhắn từ bạn.';
  else if(CUOC && (Number(CUOC.soK) || 0) >= 500) lyDoKhoa = 'Cuộc trò chuyện đã quá dài — bạn gọi điện cho cửa hàng giúp nhé.';
  else if(lyDoKhoa === 'Cửa hàng hiện không nhận tin nhắn từ bạn.' && CUOC && CUOC.chan !== true) lyDoKhoa = '';
}
function veChips(){
  const a = [];
  if(!khoaNhap()){
    if(LA_ONL){
      const dn = docJ(KDON, null);
      if(dn && dn.id) a.push('<button type="button" class="chk-chip don" data-chk-don="1">🧾 Hỏi về đơn ' + esc(maDon(dn.id)) + '</button>');
      ['Còn hàng không ạ?', 'Giao mất bao lâu ạ?', 'Có giảm giá không ạ?'].forEach(t => a.push('<button type="button" class="chk-chip" data-chk-c="' + esc(t) + '">' + esc(t) + '</button>'));
    }else{
      ['Cho thêm đá', 'Tính tiền giúp mình', 'Món của mình lâu chưa ra ạ?', 'Cho xin chén đũa'].forEach(t => a.push('<button type="button" class="chk-chip" data-chk-c="' + esc(t) + '">' + esc(t) + '</button>'));
    }
  }
  const h = a.join('');
  if(CHIPS.innerHTML !== h) CHIPS.innerHTML = h;
  CHIPS.style.display = h ? '' : 'none';
}
function veTatCa(){
  if(!KHUNG_MO) return;
  K.querySelector('.chk-tt b').textContent = (S && S.quan) || (LA_ONL ? 'Cửa hàng' : 'Quán');
  K.querySelector('.chk-tt span').textContent = LA_ONL ? 'Tin nhắn chỉ bạn và cửa hàng xem được' : ('Bạn đang ngồi ' + tenBan());
  const g = K.querySelector('.chk-goi'), sdt = LA_ONL ? sdtShop() : '';
  if(sdt){ g.href = 'tel:' + sdt; g.style.display = 'flex'; } else g.style.display = 'none';
  veKhoa();
  veChips();
  TENW.classList.toggle('on', !CUOC && !khoaNhap() && !hoSo().ten);
  veTin();
}
function coDanTa(){ TA.style.height = 'auto'; TA.style.height = Math.min(120, Math.max(44, TA.scrollHeight)) + 'px'; }

/* ───────── MỞ / ĐÓNG KHUNG ───────── */
function moKhung(){
  if(KHUNG_MO || !S || !UID || !db) return;
  KHUNG_MO = true; dauLan = true;
  K.classList.add('on'); NUT.classList.remove('on'); BAO.classList.remove('on');
  try{ ST = Date.now() + Math.random(); history.pushState({ chkKhung: ST }, ''); }catch(e){ ST = 0; }
  ngheCuoc();
  if(CUOC) ngheTin();
  if(CHAT === false) kiemChat(true);                  /* đang thấy tắt ⇒ hỏi lại, cửa hàng có thể vừa bật */
  veTatCa(); theoBanPhim();
  if(chuaDoc()) danhDauXem();
  try{ if(window.matchMedia && matchMedia('(pointer:fine)').matches) TA.focus(); }catch(e){}
}
function dongKhung(tuBack){
  if(!KHUNG_MO) return;
  KHUNG_MO = false;
  K.classList.remove('on'); K.style.height = ''; K.style.top = '';
  try{ TA.blur(); }catch(e){}
  if(!tuBack && ST){
    try{ const s = history.state; if(s && s.chkKhung === ST) history.back(); }catch(e){}
  }
  ST = 0;
  capNhatNut();
}
window.addEventListener('popstate', () => {
  if(!KHUNG_MO) return;
  let s = null; try{ s = history.state; }catch(e){}
  if(!(s && s.chkKhung === ST)) dongKhung(true);
});
function theoBanPhim(){
  if(!KHUNG_MO || !window.visualViewport) return;
  const v = window.visualViewport;
  K.style.height = Math.round(v.height) + 'px';
  K.style.top = Math.round(v.offsetTop) + 'px';
}
if(window.visualViewport){
  visualViewport.addEventListener('resize', () => { theoBanPhim(); if(KHUNG_MO) DS.scrollTop = DS.scrollHeight; });
  visualViewport.addEventListener('scroll', theoBanPhim);
}

/* ───────── SỰ KIỆN ───────── */
NUT.addEventListener('click', () => moKhung());
K.querySelector('.chk-v').addEventListener('click', () => dongKhung(false));
document.addEventListener('keydown', e => { if(KHUNG_MO && e.key === 'Escape') dongKhung(false); });
function bamGui(){
  const nd = TA.value;
  if(!String(nd).trim()) return;
  const t = String(TENI.value || '').trim();
  if(t) LS.set(KTEN, cat(t, 40));
  if(guiTin(nd, 'tx')){ TA.value = ''; coDanTa(); TENW.classList.remove('on'); }
}
GUI.addEventListener('click', bamGui);
TA.addEventListener('input', coDanTa);
TA.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    let pc = false; try{ pc = matchMedia('(pointer:fine)').matches; }catch(x){}
    if(pc){ e.preventDefault(); bamGui(); }
  }
});
TENI.addEventListener('change', () => { const t = String(TENI.value || '').trim(); if(t) LS.set(KTEN, cat(t, 40)); });
K.addEventListener('click', e => {
  const t = e.target && e.target.closest ? e.target.closest('button') : null;
  if(!t || !K.contains(t)) return;
  if(t.hasAttribute('data-chk-c')){ guiTin(t.getAttribute('data-chk-c'), 'tx'); return; }
  if(t.hasAttribute('data-chk-don')){
    const dn = docJ(KDON, null);
    if(dn && dn.id){
      let nd = 'Đơn ' + maDon(dn.id) + ' · ' + vnd(dn.tong);
      if(dn.hen) nd += ' · hẹn ' + gio(Number(dn.hen)) + ' ' + nhanNgay(Number(dn.hen)).toLowerCase();
      guiTin(nd, 'don', String(dn.id));
    }
    return;
  }
  if(t.hasAttribute('data-chk-dy')){ t.disabled = true; guiTin('Đồng ý chốt đơn', 'ok', t.getAttribute('data-chk-dy')); return; }
  if(t.hasAttribute('data-chk-lai')){
    const c = CHO.find(x => x.id === t.getAttribute('data-chk-lai'));
    if(c){ c.tt = 'cho'; c.loi = ''; c.ts = Date.now(); veTin(true); chayHang(); }
    return;
  }
  if(t.hasAttribute('data-chk-bo')){
    const i = CHO.findIndex(x => x.id === t.getAttribute('data-chk-bo'));
    if(i >= 0 && CHO[i].tt === 'loi'){ CHO.splice(i, 1); veTin(); }
  }
});
document.addEventListener('visibilitychange', () => { if(!document.hidden && KHUNG_MO && chuaDoc()) danhDauXem(); });
window.addEventListener('online', () => { treCuoc = 0; treTin = 0; if(KHUNG_MO) veTatCa(); if(!unCuoc && canNghe()) ngheCuoc(); });
window.addEventListener('offline', () => { if(KHUNG_MO) veTatCa(); });

/* ───────── KHỞI ĐỘNG ───────── */
function doiNguoi(u){
  const uid = (u && u.uid) ? u.uid : '';
  if(uid === UID) return;
  boNghe();
  CUOC = null; CUOC_SAN = false; TIN = []; TIN_SAN = false; CHO.length = 0; lyDoKhoa = ''; maLoiCuoc = ''; treCuoc = 0; treTin = 0;
  UID = uid; TID = uid ? (TK + '_' + uid) : '';
  if(canNghe()) ngheCuoc();
  if(KHUNG_MO) veTatCa();
  capNhatNut();
}
let lanCho = 0;
(function cho(){
  try{
    if(!document.body){ setTimeout(cho, 200); return; }
    if(!K.isConnected) gan();
    if(getApps().length){
      const app = getApp();
      db = getFirestore(app);
      napChat(); kiemChat(false);
      onAuthStateChanged(getAuth(app), u => { try{ doiNguoi(u); }catch(e){} });
      setInterval(() => { try{ capNhatNut(); }catch(e){} }, 400);
      return;
    }
  }catch(e){}
  if(++lanCho < 200) setTimeout(cho, 300);
})();

}catch(e){ try{ console.warn('[chk] Nhắn tin lỗi khởi động', e); }catch(x){} }
})();
</script>
<!-- ═══════════════ HẾT: NHẮN TIN VỚI CỬA HÀNG ═══════════════ -->
